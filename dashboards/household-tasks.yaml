# Glass Task Board: a ready-to-go dashboard
#
# 1. Settings → Dashboards → + Add dashboard → New dashboard from scratch.
#    Name it "Household Tasks", select Create, and open it from the sidebar.
# 2. Select the pencil, then ⋮ → Raw configuration editor.
# 3. Replace everything with this file, select Save, then Done.
#
# Board: the glass board, full screen, for a wall tablet.
# Today: what's due, every task at a glance, and what got done today.
# Nothing to edit: the Today view finds every task on its own.
title: Household Tasks
views:
  - title: Board
    path: board
    icon: mdi:checkbox-marked-circle-outline
    type: panel
    cards:
      - type: custom:glass-task-board
        title: Household tasks
        ambient_after: 120
        column_width: 260
        show_clock: true
        alert_overdue: true
        alert_sound: false
        alert_snooze: 15

  - title: Today
    path: today
    icon: mdi:format-list-checks
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Right now
            icon: mdi:clipboard-text-clock-outline
          - type: tile
            entity: sensor.glass_task_board_tasks_to_do
            name: Tasks to do
            icon: mdi:clipboard-alert-outline
            grid_options:
              columns: 6
          - type: button
            name: Open board
            icon: mdi:view-dashboard-outline
            tap_action:
              action: navigate
              navigation_path: board
            grid_options:
              columns: 6
              rows: 1
          - type: markdown
            content: |-
              {%- set tasks = states.sensor | selectattr('attributes.task_id', 'defined') | list %}
              {%- set late = tasks | selectattr('state', 'eq', 'overdue') | list %}
              {%- set due_all = tasks | selectattr('state', 'eq', 'due') | list %}
              {%- set due = (due_all | selectattr('attributes.due_at', 'string') | sort(attribute='attributes.due_at') | list)
                 + (due_all | rejectattr('attributes.due_at', 'string') | list) %}
              {%- if not tasks %}
              No tasks yet. Open the **Board** and tap **New task**.
              {%- elif not late and not due %}
              🎉 **All done for now.** Nothing is due right now.
              {%- else %}
              {%- for t in late %}
              - 🔴 {{ t.attributes.icon_emoji or '✅' }} **{{ t.name }}**, overdue{% if t.attributes.due_at %} since {{ as_timestamp(t.attributes.due_at) | timestamp_custom('%-I:%M %p') }}{% endif %}
              {%- endfor %}
              {%- for t in due %}
              - ⚪ {{ t.attributes.icon_emoji or '✅' }} **{{ t.name }}**{% if t.attributes.due_at %}, due by {{ as_timestamp(t.attributes.due_at) | timestamp_custom('%-I:%M %p') }}{% else %}, any time today{% endif %}
              {%- endfor %}
              {%- endif %}

      - type: grid
        cards:
          - type: heading
            heading: All tasks
            icon: mdi:format-list-bulleted
          - type: markdown
            content: |-
              {%- set tasks = states.sensor | selectattr('attributes.task_id', 'defined') | sort(attribute='name') | list %}
              {%- set label = {'done': '✅ Done', 'due': '⚪ Due', 'overdue': '🔴 Overdue', 'upcoming': '🗓️ Coming up'} %}
              {%- if not tasks %}
              No tasks yet.
              {%- else %}
              | | Task | Status | Repeats |
              |---|---|---|---|
              {%- for t in tasks %}
              | {{ t.attributes.icon_emoji or '✅' }} | {{ t.name }} | {{ label.get(t.state, t.state) }} | {{ t.attributes.schedule or '' }} |
              {%- endfor %}
              {%- endif %}

      - type: grid
        cards:
          - type: heading
            heading: Done today
            icon: mdi:check-all
          - type: markdown
            content: |-
              {%- set today = now().date() %}
              {%- set ns = namespace(rows=[]) %}
              {%- for t in states.sensor | selectattr('attributes.task_id', 'defined') | selectattr('attributes.last_done_at', 'string') %}
              {%- set at = as_datetime(t.attributes.last_done_at) | as_local %}
              {%- if at.date() == today %}{% set ns.rows = ns.rows + [(at, t)] %}{% endif %}
              {%- endfor %}
              {%- if not ns.rows %}
              Nothing ticked off yet today.
              {%- else %}
              {%- for at, t in ns.rows | sort(attribute='0', reverse=true) %}
              - {{ t.attributes.icon_emoji or '✅' }} **{{ t.name }}** by {{ t.attributes.last_done_by or 'someone' }} at {{ at.strftime('%-I:%M %p') }}
              {%- endfor %}
              {%- endif %}
          - type: button
            name: Home
            icon: mdi:home
            tap_action:
              action: navigate
              navigation_path: /
            grid_options:
              columns: 12
              rows: 1
